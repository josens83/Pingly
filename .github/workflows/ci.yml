name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 의존성 설치 (다른 작업들이 재사용)
  # ─────────────────────────────────────────────────────────────
  install:
    name: 📦 의존성 설치
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Prisma Client 캐싱
      - name: Prisma 캐시
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            prisma-

      - run: npm ci
      - run: npx prisma generate

      # node_modules를 아티팩트로 저장
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # 타입 체크 (병렬)
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: 🔍 타입 체크
    needs: install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # 린트 검사 (병렬)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 📋 린트 검사
    needs: install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # Prisma 스키마 검증 (병렬)
  # ─────────────────────────────────────────────────────────────
  prisma:
    name: 🗄️ Prisma 검증
    needs: install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Prisma 스키마 검증
        run: npx prisma validate

      - name: Prisma 포맷 검사
        run: |
          npx prisma format
          git diff --exit-code prisma/schema.prisma || \
            (echo "Prisma schema needs formatting: npx prisma format" && exit 1)

  # ─────────────────────────────────────────────────────────────
  # 빌드 테스트 (typecheck, lint, prisma 모두 통과 후)
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ 빌드
    needs: [typecheck, lint, prisma]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: 빌드 결과물 저장
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next
          retention-days: 7
