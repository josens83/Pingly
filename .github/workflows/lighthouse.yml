# Lighthouse Performance Audit
# Elite Performance Standards

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
          NEXTAUTH_SECRET: 'test-secret-for-ci'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Format Lighthouse Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');

            // Read Lighthouse results
            const resultsPath = '.lighthouseci';
            if (!fs.existsSync(resultsPath)) {
              console.log('No Lighthouse results found');
              return;
            }

            const files = fs.readdirSync(resultsPath).filter(f => f.endsWith('.json') && f.startsWith('lhr'));
            if (files.length === 0) {
              console.log('No Lighthouse JSON files found');
              return;
            }

            // Parse first result for summary
            const result = JSON.parse(fs.readFileSync(`${resultsPath}/${files[0]}`));

            const scores = {
              performance: Math.round(result.categories.performance.score * 100),
              accessibility: Math.round(result.categories.accessibility.score * 100),
              bestPractices: Math.round(result.categories['best-practices'].score * 100),
              seo: Math.round(result.categories.seo.score * 100),
            };

            const getEmoji = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 50) return '🟡';
              return '🔴';
            };

            const body = `## Lighthouse Performance Report

            | Category | Score |
            |----------|-------|
            | ${getEmoji(scores.performance)} Performance | ${scores.performance} |
            | ${getEmoji(scores.accessibility)} Accessibility | ${scores.accessibility} |
            | ${getEmoji(scores.bestPractices)} Best Practices | ${scores.bestPractices} |
            | ${getEmoji(scores.seo)} SEO | ${scores.seo} |

            ### Core Web Vitals
            | Metric | Value |
            |--------|-------|
            | LCP (Largest Contentful Paint) | ${result.audits['largest-contentful-paint'].displayValue} |
            | TBT (Total Blocking Time) | ${result.audits['total-blocking-time'].displayValue} |
            | CLS (Cumulative Layout Shift) | ${result.audits['cumulative-layout-shift'].displayValue} |

            > 🎯 Elite Standard: All scores ≥ 90

            [View Full Report](${result.finalUrl})
            `;

            // Post as PR comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Lighthouse Performance Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: body,
              });
            }
